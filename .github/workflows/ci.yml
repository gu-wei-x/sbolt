name: Sbolt_CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.platforms.distro }}
    strategy: 
      matrix:
        profile: [dev, release]
        platforms:
          - { name: macOS, distro: macOS-latest, toolchain: stable }
          - { name: Linux, distro: ubuntu-latest, toolchain: stable }
          - { name: Windows, distro: windows-latest, toolchain: stable }

    steps:
    - name: Checkout 
      uses: actions/checkout@v4
      
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.platforms.toolchain }}

    - name: Build core
      run: cargo build --workspace --verbose --profile ${{ matrix.profile }}
      working-directory: ./rust
      
    - name: Run core tests
      run: cargo test --workspace --verbose --profile ${{ matrix.profile }}
      working-directory: ./rust
      
    - name: Build examples
      run: cargo build --workspace --verbose --profile ${{ matrix.profile }}
      working-directory: ./rust/examples

    - name: Run example tests
      run: cargo test --workspace --verbose --profile ${{ matrix.profile }}
      working-directory: ./rust/examples

    - name: Validate rendering allocations
      if: matrix.profile == 'release' && matrix.platforms.name == 'Linux'
      run: cargo bench -p lib_bench --bench render_allocations
      working-directory: ./rust