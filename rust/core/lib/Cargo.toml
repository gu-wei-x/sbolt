[package]
name = "sbolt"
version = "0.0.4"
authors = ["Wei Gu"]
edition = "2024"
description = """
A small and fast view template engine in rust
"""
keywords = ["html", "layout", "template", "web"]
readme = "../../../doc/user/lib_README.md"
license = "MIT"
repository = "https://github.com/gu-wei-x/sbolt"

[lints]
workspace = true

[dependencies]
itoa = "1"
mime = "0.3"
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["rc"] }
serde_json = { version = "1", features = ["raw_value"] }
syn = { version = "2", features = ["full"] }
unicode-ident = "1"
winnow = "0.7"

#optional
prettyplease = { version = "0.2", optional = true }

[dev-dependencies]
indexmap = "2"

[features]
pretty = [ "prettyplease"]

