[workspace]
resolver = "2"
members = [
  "roster/actix/src/app",
  "roster/actix/src/app_tests/it",
  "roster/axum/src/app",
  "roster/axum/src/app_tests/it",
  "roster/rocket/src/app",
  "roster/rocket/src/app_tests/it",
  "roster/shared/config",
  "roster/shared/data",
  "roster/shared/views",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
actix-web = "4"
actix-files = "0.6"
axum = "0.8"
rocket = { version = "0.5.1", default-features = false }
sbolt = { path = "../../core/lib" }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }